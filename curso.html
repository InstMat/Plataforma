<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Curso</title>

  <!-- Resource hints para optimizar conexiones -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://inst-mat.utalca.cl">
  <link rel="dns-prefetch" href="https://www.utalca.cl">

  <!-- CSS crítico inline para evitar FOUC -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/curso.css">

  <!-- CSS no crítico con preload -->
  <link rel="preload" href="styles/landing.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" as="style"
    crossorigin onload="this.onload=null;this.rel='stylesheet'">

  <!-- Preload de scripts críticos -->
  <link rel="preload" href="scripts/course-shell.js" as="script">
  <link rel="preload" href="scripts/lecciones.js" as="script">

  <!-- Fallback para CSS si JavaScript está deshabilitado -->
  <noscript>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/curso.css">
    <link rel="stylesheet" href="styles/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  </noscript>
</head>

<body>
  <div class="container">
    <header>
      <button id="menu-toggle" class="menu-toggle">
        <i class="fas fa-bars"></i> Menú
      </button>
      <div class="header-content">
        <div class="logo-left">
          <a href="http://www.utalca.cl" target="_blank"><img src="images/logo-universidad.png"
              alt="Logo de la Universidad"></a><a href="http://inst-mat.utalca.cl" target="_blank"><img
              src="images/logo-instituto.png" alt="Logo del Instituto"></a>
        </div>

        <div class="header-title">
          <h1>Plataforma de Módulos Matemáticos</h1>
          <p>Instituto de Matemáticas</p>
          <p>Universidad de Talca</p>
        </div>

        <div class="logo-right"></div>
      </div>
    </header>

    <div class="main-content">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a href="plataforma.html" class="home-button">
            <i class="fas fa-home"></i> Volver al inicio
          </a>
        </div>
        <h2 id="course-title">Curso</h2>
        <div id="unidades-container"></div>
      </div>
      <div class="content">
        <iframe name="contenido" src=""></iframe>
      </div>
    </div>
  </div>

  <!-- Modal de Acceso Denegado -->
  <div class="access-denied-modal" id="accessDeniedModal">
    <div class="access-denied-content">
      <h2><i class="fas fa-ban" style="color: #e53e3e;"></i> Acceso Denegado</h2>
      <div id="accessDeniedMessage"></div>
      <button onclick="window.location.href='plataforma.html'">Volver al Inicio</button>
    </div>
  </div>

  <script src="scripts/course-shell.js" defer></script>
  <script src="scripts/lecciones.js" defer></script>
</body>

</html>
